services:
  qoder2api:
    image: ghcr.io/sdcom-0415/qoder2api:latest
    build: .
    restart: unless-stopped
    ports:
      - "3588:3588"
      - "8963:8963"
      - "8964:8964"
    environment:
      QODER2API_CONSOLE_PASSWORD: ${QODER2API_CONSOLE_PASSWORD:-}
    volumes:
      - qoder2api-data:/data

volumes:
  qoder2api-data: